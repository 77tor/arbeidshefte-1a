<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arbeidshefte 1. Klasse – Hånes skole</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-layout">
    <!-- VENSTREMENY (identisk stil som Leseark 1. Klasse) -->
    <aside class="sidebar no-print">
      <!-- Topp: Ikon, Tittel & Logg inn -->
      <div class="sidebar-top">
        <div class="brand-group">
          <div class="brand-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
            </svg>
          </div>
          <div>
            <h1>Arbeidshefte 1. Klasse</h1>
            <p class="subtitle">Utskriftsklare arbeidsark</p>
          </div>
        </div>
        <div id="auth-btn-wrapper"></div>
      </div>

      <div class="sidebar-section-label">VELG UKE / ARK</div>

      <!-- Rullbar liste med kort for Ark 1–14 -->
      <div id="sheet-cards-list" class="sheet-cards-list"></div>

      <!-- Fast bunnpanel -->
      <div class="sidebar-bottom">
        <div class="bottom-tools-row">
          <button type="button" id="btn-edit-weeks" class="btn-outline-tool">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            Rediger ukenumre
          </button>
          <label class="page-num-toggle">
            <input type="checkbox" id="chk-show-pagenums" checked />
            <span>Vis sidetall</span>
          </label>
        </div>

        <button type="button" id="btn-print" class="btn-print-main">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>
          </svg>
          Skriv ut
        </button>
      </div>
    </aside>

    <!-- FORHÅNDSVISNING (A4-ARK) -->
    <main class="preview-area">
      <div id="sheets-container"></div>
    </main>
  </div>

  <!-- MODAL: INNLOGGING -->
  <div id="login-modal" class="modal-backdrop hidden no-print">
    <div class="modal-box">
      <h2>Logg inn – Hånes skole</h2>
      <p>Logg inn for å fjerne prøveeksemplar-vannmerket før utskrift.</p>
      <form id="login-form">
        <div class="form-group">
          <label for="login-user">Brukernavn</label>
          <input type="text" id="login-user" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="login-pass">Passord</label>
          <input type="password" id="login-pass" autocomplete="current-password" required />
        </div>
        <p id="login-error" class="error-text hidden">Feil brukernavn eller passord.</p>
        <div class="modal-actions">
          <button type="button" id="btn-close-login" class="btn-modal-sec">Avbryt</button>
          <button type="submit" class="btn-modal-pri">Logg inn</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: REDIGER UKENUMRE -->
  <div id="weeks-modal" class="modal-backdrop hidden no-print">
    <div class="modal-box modal-wide">
      <h2>Rediger ukenumre</h2>
      <p>Tilpass uketeksten for hvert arbeidsark (lagres automatisk).</p>
      <div id="weeks-editor-grid" class="weeks-editor-grid"></div>
      <div class="modal-actions">
        <button type="button" id="btn-reset-weeks" class="btn-modal-sec">Tilbakestill standard</button>
        <button type="button" id="btn-close-weeks" class="btn-modal-pri">Ferdig</button>
      </div>
    </div>
  </div>

  <!-- Oppgavebank-register -->
  <script>
    window.NORSK_DATA = {};
    window.MATTE_DATA = {};
  </script>

  <!-- Last inn alle 14 ark for norsk -->
  <script src="norsk/norsk_01.js"></script>
  <script src="norsk/norsk_02.js"></script>
  <script src="norsk/norsk_03.js"></script>
  <script src="norsk/norsk_04.js"></script>
  <script src="norsk/norsk_05.js"></script>
  <script src="norsk/norsk_06.js"></script>
  <script src="norsk/norsk_07.js"></script>
  <script src="norsk/norsk_08.js"></script>
  <script src="norsk/norsk_09.js"></script>
  <script src="norsk/norsk_10.js"></script>
  <script src="norsk/norsk_11.js"></script>
  <script src="norsk/norsk_12.js"></script>
  <script src="norsk/norsk_13.js"></script>
  <script src="norsk/norsk_14.js"></script>

  <!-- Last inn alle 14 ark for matte -->
  <script src="matte/matte_01.js"></script>
  <script src="matte/matte_02.js"></script>
  <script src="matte/matte_03.js"></script>
  <script src="matte/matte_04.js"></script>
  <script src="matte/matte_05.js"></script>
  <script src="matte/matte_06.js"></script>
  <script src="matte/matte_07.js"></script>
  <script src="matte/matte_08.js"></script>
  <script src="matte/matte_09.js"></script>
  <script src="matte/matte_10.js"></script>
  <script src="matte/matte_11.js"></script>
  <script src="matte/matte_12.js"></script>
  <script src="matte/matte_13.js"></script>
  <script src="matte/matte_14.js"></script>

  <!-- Hovedlogikk -->
  <script src="app.js"></script>
</body>
</html>
